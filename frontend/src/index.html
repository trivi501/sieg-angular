<!doctype html>
<html lang="es">
  <head>
    <title>SIEG — Sistema de Egresos</title>
    <base href="/" />
    <!-- Meta -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=1, minimal-ui" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="SIEG — Sistema de Egresos del Ayuntamiento de Guadalupe, Zacatecas." />
    <meta name="author" content="Ayuntamiento de Guadalupe, Zacatecas" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/images/logo-guadalupe.png" />
    <!-- font style -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
      id="main-font-link"
    />
  </head>
  <body part="preset-1">
    <app-root>
      <!-- Mientras arranca Angular (se reemplaza al iniciar la app). -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff">
        <div style="position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;inset:0;border-radius:50%;border:4px solid rgba(122,52,70,.15);border-top-color:#7a3446;border-right-color:#c4956f;animation:pre-girar .9s linear infinite"></div>
          <img src="assets/images/logo-emblema.png" alt="" style="height:64px" />
        </div>
        <span style="color:#7a3446;font-weight:600;font-family:sans-serif">Cargando…</span>
      </div>
      <style>@keyframes pre-girar { to { transform: rotate(360deg); } }</style>
    </app-root>
  </body>
</html>
