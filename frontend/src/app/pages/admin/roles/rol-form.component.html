<app-card [cardTitle]="id ? 'Editar rol' : 'Nuevo rol'">
  <form (ngSubmit)="guardar()">
    @if (error()) {
      <div class="alert alert-danger py-2">{{ error() }}</div>
    }

    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label" for="nombre">Nombre del rol</label>
        <input
          id="nombre"
          name="nombre"
          class="form-control"
          required
          [ngModel]="nombre()"
          (ngModelChange)="nombre.set($event)"
          [class.is-invalid]="errores()['name']"
        />
        <div class="invalid-feedback">{{ errores()['name'] }}</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="filtro">Buscar permiso</label>
        <input id="filtro" name="filtro" class="form-control" placeholder="p. ej. requisiciones" [ngModel]="filtro()" (ngModelChange)="filtro.set($event)" />
      </div>
    </div>

    <p class="text-muted mb-2">{{ seleccionados().size }} de {{ permisos().length }} permisos seleccionados</p>

    @for (g of grupos(); track g.categoria) {
      <div class="border rounded p-3 mb-3">
        <div class="form-check mb-2">
          <input
            class="form-check-input"
            type="checkbox"
            [id]="'grupo-' + $index"
            [checked]="todosMarcados(g.items)"
            (change)="alternarGrupo(g.items, $any($event.target).checked)"
          />
          <label class="form-check-label fw-semibold" [for]="'grupo-' + $index">{{ g.categoria }}</label>
        </div>
        <div class="row">
          @for (p of g.items; track p.id) {
            <div class="col-sm-6 col-lg-4">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="'perm-' + p.id"
                  [checked]="seleccionados().has(p.id)"
                  (change)="alternar(p.id, $any($event.target).checked)"
                />
                <label class="form-check-label" [for]="'perm-' + p.id">
                  {{ p.nombre_mostrar || p.name }}
                  @if (p.nombre_mostrar) {
                    <small class="text-muted d-block">{{ p.name }}</small>
                  }
                </label>
              </div>
            </div>
          }
        </div>
      </div>
    }

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="guardando()">{{ guardando() ? 'Guardando…' : 'Guardar' }}</button>
      <a routerLink="/roles" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</app-card>
