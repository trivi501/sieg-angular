<app-navigation class="pc-sidebar" [ngClass]="{
    'navbar-collapsed': navCollapsed,
    'mob-open': navCollapsedMob
  }" (NavCollapse)="closeMenu()" />
<app-nav-bar (NavCollapsedMob)="navMobClick()" (NavCollapse)="handleNavCollapse()" />
<!-- Cierre de sesión por inactividad: avisa dos minutos antes -->
<app-inactividad />
<div class="pc-container">
  <div class="coded-wrapper">
    <div class="coded-content">
      <div class="coded-inner-content">
        <app-breadcrumb />
        <div class="main-body">
          <div class="page-wrapper">
            <router-outlet />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="pc-menu-overlay" (click)="closeMenu()" (keydown)="handleKeyDown($event)" tabindex="0"></div>
</div>
<footer class="pc-footer">
  <div class="footer-wrapper container-fluid">
    <div class="row">
      <div class="col my-1">
        <p class="m-0">Ayuntamiento de Guadalupe, Zacatecas · Administración 2024 – 2027</p>
      </div>
      <div class="col-auto my-1">
        <p class="m-0 text-muted">SIEG — Sistema de Egresos</p>
      </div>
    </div>
  </div>
</footer>
