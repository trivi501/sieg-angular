@if (isSpinnerVisible()) {
  <div id="http-loader" role="status" aria-live="polite">
    <div class="loader-bg"></div>
    <div class="loader-caja">
      <div class="loader-anillo"></div>
      <img src="assets/images/logo-emblema.png" alt="" class="loader-emblema" />
    </div>
    <span class="loader-texto">Cargando…</span>
  </div>
}
